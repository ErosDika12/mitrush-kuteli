<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dokumentet | SHFMU “Mitrush Kuteli”</title>
  <meta name="description" content="Orare dhe dokumente të SHFMU “Mitrush Kuteli” për shikim dhe shkarkim.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17243b">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/page-dokumente.css">
  <script>
    try { var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-bs-theme', t); } catch (e) {}
    document.documentElement.classList.add('js');
  </script>
</head>
<body data-active="prindi">
  <a class="visually-hidden-focusable" href="#main">Kalo te përmbajtja</a>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="container">
        <nav aria-label="Rruga e faqes"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="index.html">Ballina</a></li><li class="breadcrumb-item active" aria-current="page">Dokumentet</li></ol></nav>
        <span class="eyebrow">Dokumentet</span>
        <h1>Dokumentet e shkollës</h1>
        <p class="lead">Orare dhe dokumente me titullin origjinal, vitin shkollor dhe formatin e skedarit.</p>
      </div>
    </section>

    <div class="filter-bar">
      <div class="container">
        <form id="d-filters" class="row g-2 g-md-3 align-items-end" role="search" aria-label="Filtro dokumentet">
          <div class="col-12 col-md-5">
            <label for="d-q">Fjalë kyçe</label>
            <div class="search-field">
              <i class="bi bi-search" aria-hidden="true"></i>
              <input id="d-q" class="form-control" type="search" autocomplete="off" placeholder="Titulli ose përshkrimi" data-search-focus>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <label for="d-cat">Kategoria</label>
            <select id="d-cat" class="form-select">
              <option value="">Të gjitha</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label for="d-year">Viti</label>
            <select id="d-year" class="form-select">
              <option value="">Të gjithë</option>
            </select>
          </div>
          <div class="col-12 col-md-2">
            <button class="btn btn-ghost-soft w-100" type="button" id="d-reset">Pastro</button>
          </div>
        </form>
      </div>
    </div>

    <section class="section-tight">
      <div class="container">
        <p class="count-line" id="d-count" aria-live="polite"></p>
        <h2 class="visually-hidden">Lista e dokumenteve</h2>
        <div class="d-grid gap-3" id="doc-list"></div>
        <div class="empty-state" id="d-empty" hidden>
          <i class="bi bi-folder2-open" aria-hidden="true"></i>
          <h3>Asnjë dokument nuk përputhet</h3>
          <p>Pastroni filtrat për të parë të gjitha dokumentet.</p>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/page-dokumente.js" defer></script>
</body>
</html>
