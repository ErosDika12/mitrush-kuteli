<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stafi | SHFMU “Mitrush Kuteli”</title>
  <meta name="description" content="Drejtoria, mësimdhënësit sipas lëndës, arsimi fillor dhe parafillor, shërbimet mbështetëse dhe psikologia e SHFMU “Mitrush Kuteli”, me kërkim sipas emrit ose lëndës.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17243b">
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/page-stafi.css">
  <script>
    try { var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.setAttribute('data-bs-theme', t); } catch (e) {}
    document.documentElement.classList.add('js');
  </script>
</head>
<body data-active="stafi">
  <a class="visually-hidden-focusable" href="#main">Kalo te përmbajtja</a>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="container">
        <nav aria-label="Rruga e faqes"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="index.html">Ballina</a></li><li class="breadcrumb-item active" aria-current="page">Stafi</li></ol></nav>
        <h1>Njerëzit e shkollës</h1>
      </div>
    </section>

    <div class="filter-bar" id="sd-bar">
      <div class="container">
        <form class="row g-2 g-md-3 align-items-end" id="staff-filters" role="search" aria-label="Kërko në stafin">
          <div class="col-12 col-md-6">
            <label class="visually-hidden" for="f-q">Kërko emër ose lëndë</label>
            <div class="search-field"><i class="bi bi-search" aria-hidden="true"></i>
              <input id="f-q" class="form-control" type="search" name="q" autocomplete="off" placeholder="Kërko emër ose lëndë" data-search-focus>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <label for="f-lenda">Lënda</label>
            <select id="f-lenda" class="form-select" name="lenda"><option value="">Të gjitha</option></select>
          </div>
          <div class="col-6 col-md-3">
            <label for="f-grupi">Kategoria</label>
            <select id="f-grupi" class="form-select" name="grupi"><option value="">Të gjitha</option></select>
          </div>
        </form>
        <nav class="sd-chips" id="staff-chips" aria-label="Kategoritë e stafit"></nav>
      </div>
    </div>

    <section class="section-tight">
      <div class="container staff-dir">
        <p class="count-line" id="staff-count-wrap">
          <span id="staff-count" aria-live="polite"></span>
          <button class="clear-link" type="button" id="staff-clear" hidden>Pastro filtrat</button>
        </p>

        <div id="staff-sections"></div>

        <div class="empty-state" id="staff-empty" role="status" hidden>
          <i class="bi bi-search" aria-hidden="true"></i>
          <h3>Nuk u gjet asnjë person</h3>
          <p>Provoni një shkrim tjetër ose pastroni filtrat.</p>
          <button class="btn btn-brand" type="button" id="staff-empty-reset">Pastro filtrat</button>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/page-stafi.js" defer></script>
</body>
</html>
